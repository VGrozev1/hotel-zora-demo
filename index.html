<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Семеен хотел Зора — София</title>
<meta name="description" content="Семеен хотел Зора — уютен хотел в София, кв. Лагера, до Пирогов и ВМА. Директна резервация.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{
  --bg:#faf6ef; --surface:#fff; --ink:#1d2a2f; --muted:#5d6b70; --line:#e6dfd2;
  --brand:#16424a; --brand-2:#0e2d33; --accent:#c8873a; --accent-2:#e9b872;
  --radius:18px; --shadow:0 10px 30px rgba(22,66,74,.12);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme=light]){--bg:#0f1a1d;--surface:#17262a;--ink:#f1ece2;--muted:#a3b2b6;--line:#26383d;--brand:#7fc1c9;--brand-2:#0a1315;--shadow:0 10px 30px rgba(0,0,0,.4)}
}
:root[data-theme=dark]{--bg:#0f1a1d;--surface:#17262a;--ink:#f1ece2;--muted:#a3b2b6;--line:#26383d;--brand:#7fc1c9;--brand-2:#0a1315;--shadow:0 10px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;line-height:1.1;font-weight:600}
a{color:inherit}
.wrap{max-width:1180px;margin:auto;padding:0 20px}
section{padding:88px 0}
.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:.75rem;color:var(--accent);font-weight:600;margin-bottom:12px}
h2{font-size:clamp(2rem,4.5vw,3.2rem);margin-bottom:16px}
.lead{color:var(--muted);max-width:620px;font-size:1.05rem}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:999px;background:var(--accent);color:#1b1206;font-weight:600;text-decoration:none;border:0;cursor:pointer;font:inherit;font-weight:600;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(200,135,58,.4)}
.btn.ghost{background:transparent;color:#fff;border:1.5px solid rgba(255,255,255,.6)}

/* nav */
header{position:fixed;inset:0 0 auto 0;z-index:50;transition:background .3s,box-shadow .3s}
header.solid{background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);box-shadow:0 1px 0 var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;height:72px}
.logo{font-family:"Cormorant Garamond",serif;font-size:1.7rem;font-weight:700;text-decoration:none;color:#fff;display:flex;align-items:center;gap:10px}
header.solid .logo{color:var(--brand)}
.logo i{width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 50% 100%,var(--accent-2),var(--accent) 60%,transparent 61%),var(--brand-2);display:block;border:2px solid var(--accent)}
nav ul{display:flex;gap:28px;list-style:none;padding:0}
nav a{text-decoration:none;font-size:.92rem;font-weight:500;color:#fff;opacity:.92}
header.solid nav a{color:var(--ink)}
nav a:hover{color:var(--accent)}
.tools{display:flex;gap:12px;align-items:center}
.lang{display:flex;border:1px solid rgba(255,255,255,.5);border-radius:999px;overflow:hidden}
header.solid .lang{border-color:var(--line)}
.lang button{background:none;border:0;padding:6px 11px;font:inherit;font-size:.78rem;font-weight:600;cursor:pointer;color:#fff}
header.solid .lang button{color:var(--ink)}
.lang button.on{background:var(--accent);color:#1b1206!important}
.burger{display:none;background:none;border:0;color:#fff;font-size:1.6rem;cursor:pointer}
header.solid .burger{color:var(--ink)}

/* hero */
.hero{min-height:100svh;display:flex;align-items:center;color:#fff;position:relative;overflow:hidden;
  background:
   radial-gradient(1200px 600px at 80% 10%,rgba(233,184,114,.35),transparent 60%),
   linear-gradient(160deg,#0e2d33 0%,#16424a 55%,#1f5a62 100%)}
.hero:before{content:"";position:absolute;inset:0;background:
  linear-gradient(transparent 60%,rgba(0,0,0,.35)),
  repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 1px,transparent 1px 90px)}
.skyline{position:absolute;bottom:0;left:0;width:100%;height:30%;opacity:.18}
.heroimg{position:absolute;right:max(20px,calc((100vw - 1180px)/2 + 20px));top:50%;transform:translateY(-44%) rotate(2deg);width:min(30vw,380px);aspect-ratio:4/5;border-radius:22px;overflow:hidden;border:6px solid rgba(255,255,255,.9);box-shadow:0 30px 60px rgba(0,0,0,.4)}.heroimg img{width:100%;height:100%;object-fit:cover;object-position:60% 50%}
.hero .wrap{position:relative;padding-top:110px;padding-bottom:140px}
.hero h1{font-size:clamp(2.8rem,6vw,5.2rem);max-width:min(800px,58%);margin-bottom:20px}
.hero h1 em{color:var(--accent-2);font-style:italic}
.hero p{max-width:min(560px,56%);font-size:1.15rem;opacity:.9;margin-bottom:32px}
.hero .cta{display:flex;gap:14px;flex-wrap:wrap}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:36px}
.chips span{font-size:.82rem;padding:7px 14px;border:1px solid rgba(255,255,255,.3);border-radius:999px;backdrop-filter:blur(6px);background:rgba(255,255,255,.08)}

/* booking bar */
.book{position:relative;margin-top:-70px;z-index:5}
.bar{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px;display:grid;grid-template-columns:repeat(4,1fr) auto;gap:14px;align-items:end;border:1px solid var(--line)}
.bar label{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;margin-bottom:6px}
.bar input,.bar select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
.bar input:focus,.bar select:focus{outline:2px solid var(--accent);outline-offset:1px}

/* about */
.about{display:grid;grid-template-columns:1.1fr 1fr;gap:56px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:32px}
.stat{padding:18px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
.stat b{font-family:"Cormorant Garamond",serif;font-size:2.3rem;color:var(--brand);display:block;line-height:1}
.stat span{font-size:.82rem;color:var(--muted)}
.ph{border-radius:var(--radius);position:relative;overflow:hidden;color:rgba(255,255,255,.85);display:flex;align-items:flex-end;padding:16px;font-size:.78rem;letter-spacing:.04em}
.ph svg{position:absolute;inset:0;width:100%;height:100%;opacity:.25}
.ph.a{background:linear-gradient(135deg,#1f5a62,#0e2d33)}
.ph.b{background:linear-gradient(135deg,#c8873a,#8a5420)}
.ph.c{background:linear-gradient(135deg,#3a6f78,#16424a)}
.ph.d{background:linear-gradient(135deg,#6d4c2a,#2c1d10)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:1!important;transition:transform .6s}.card:hover .ph img,.gal .ph:hover img{transform:scale(1.05)}
.ph span{position:relative;z-index:1;background:rgba(0,0,0,.35);padding:4px 10px;border-radius:999px}
.about .ph{aspect-ratio:4/5;box-shadow:var(--shadow)}

/* rooms */
.rooms{background:linear-gradient(var(--bg),color-mix(in srgb,var(--brand) 6%,var(--bg)))}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:22px;margin-top:44px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow)}
.card .ph{height:170px;border-radius:0}
.card .body{padding:22px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:1.6rem}
.card p{color:var(--muted);font-size:.92rem;flex:1}
.price{display:flex;align-items:baseline;gap:6px;margin-top:6px}
.price b{font-family:"Cormorant Garamond",serif;font-size:2rem;color:var(--brand)}
.price small{color:var(--muted)}
.tag{position:absolute;top:14px;right:14px;background:var(--accent);color:#1b1206;font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:999px;z-index:2}
.note{margin-top:22px;color:var(--muted);font-size:.88rem}

/* why */
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px;margin-top:44px}
.feat{padding:26px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--line)}
.feat .ic{width:46px;height:46px;border-radius:12px;background:color-mix(in srgb,var(--accent) 18%,transparent);display:grid;place-items:center;font-size:1.3rem;margin-bottom:14px}
.feat h3{font-size:1.4rem;margin-bottom:6px}
.feat p{color:var(--muted);font-size:.92rem}

/* location */
.loc{background:var(--brand-2);color:#f1ece2}
.loc .lead{color:#b5c4c7}
.locgrid{display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:center}
.near{list-style:none;padding:0;margin-top:26px;display:grid;gap:12px}
.near li{display:flex;justify-content:space-between;padding:14px 18px;background:rgba(255,255,255,.06);border-radius:12px;border:1px solid rgba(255,255,255,.08)}
.near li span:last-child{color:var(--accent-2)}
.map{border-radius:var(--radius);overflow:hidden;min-height:380px;border:1px solid rgba(255,255,255,.12)}
.mapcard{display:grid;place-items:center;background:rgba(255,255,255,.06);padding:32px;text-align:center}.mapcard>div{display:grid;gap:14px;justify-items:center}.mapcard b{font-family:"Cormorant Garamond",serif;font-size:1.6rem;font-weight:600}.mapcard small{color:var(--accent-2);text-transform:uppercase;letter-spacing:.14em}.map iframe{width:100%;height:100%;min-height:380px;border:0;filter:grayscale(.3) contrast(1.05)}

/* gallery */
.gal{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:190px;gap:14px;margin-top:40px}
.gal .ph:nth-child(1){grid-column:span 2;grid-row:span 2}
.gal .ph:nth-child(4){grid-column:span 2}

/* contact */
.contact{display:grid;grid-template-columns:1fr 1fr;gap:48px}
.clist{list-style:none;padding:0;display:grid;gap:16px;margin-top:26px}
.clist li{display:flex;gap:14px}
.clist .ic{width:42px;height:42px;flex:none;border-radius:12px;background:color-mix(in srgb,var(--accent) 18%,transparent);display:grid;place-items:center}
.clist small{display:block;color:var(--muted)}
.clist a{text-decoration:none;font-weight:500}
form{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:28px;display:grid;gap:14px;box-shadow:var(--shadow)}
form input,form textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit}
form textarea{min-height:110px;resize:vertical}
footer{background:var(--brand-2);color:#9fb0b4;padding:32px 0;font-size:.88rem}
footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.sticky{display:none}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);max-width:min(560px,calc(100% - 32px));background:var(--brand-2);color:#f1ece2;padding:16px 20px;border-radius:14px;box-shadow:var(--shadow);z-index:80;font-size:.92rem;border:1px solid var(--accent)}
.reveal{transition:.7s}

@media(max-width:900px){
  section{padding:64px 0}
  nav ul{position:fixed;inset:72px 0 auto 0;background:var(--bg);flex-direction:column;padding:20px;gap:16px;transform:translateY(-130%);transition:.3s;box-shadow:var(--shadow)}
  nav ul.open{transform:none}
  nav a{color:var(--ink)!important;font-size:1.05rem}
  .burger{display:block}
  .bar{grid-template-columns:1fr 1fr}
  .bar .btn{grid-column:span 2;justify-content:center}
  .heroimg{display:none}
  .about .ph{aspect-ratio:4/3}
  .hero h1,.hero p{max-width:none}
  .about,.locgrid,.contact{grid-template-columns:1fr}
  .gal{grid-template-columns:1fr 1fr;grid-auto-rows:150px}
  .stats{grid-template-columns:1fr 1fr 1fr}
  .sticky{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:60;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px;gap:10px}
  .sticky a{flex:1;justify-content:center;padding:12px}
  footer{padding-bottom:84px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}.reveal{opacity:1;transform:none}}
</style>
</head>

function render(){
  const t=T[lang];document.documentElement.lang=lang;
  document.querySelectorAll("[data-i]").forEach(e=>e.innerHTML=t[e.dataset.i]);
  document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t[e.dataset.ph]);
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.l===lang));
  document.getElementById("roomGrid").innerHTML=ROOMS.map(r=>`<article class="card reveal in"><div class="ph ${r.c}" style="position:relative">${r.pop?`<span class="tag">${t.pop}</span>`:""}<img loading="lazy" src="img/${r.i}.jpg" alt="${t[r.k]}"></div><div class="body"><h3>${t[r.k]}</h3><p>${t[r.k+"d"]}</p><div class="price"><small>${r.k=="rm4"?"":(lang=="en"?"from":lang=="ru"?"от":"от")}</small><b>€${r.p}</b><small>${t.night}</small></div><button class="btn" data-pick="${r.k}">${t.pick}</button></div></article>`).join("");
  const sel=document.getElementById("roomSel"),cur=sel.value;
  sel.innerHTML=ROOMS.map(r=>`<option value="${r.k}">${t[r.k]} — €${r.p}</option>`).join("");if(cur)sel.value=cur;

const din=document.getElementById("din"),dout=document.getElementById("dout"),iso=d=>d.toISOString().slice(0,10);
const today=new Date(),tom=new Date(Date.now()+864e5);
din.min=iso(today);din.value=iso(tom);dout.value=iso(new Date(Date.now()+2*864e5));
din.onchange=()=>{dout.min=din.value;if(dout.value<=din.value){const d=new Date(din.value);d.setDate(d.getDate()+1);dout.value=iso(d)}};
